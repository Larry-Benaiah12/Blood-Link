<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · BloodLink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#c62828">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .offline {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      text-align: center;
    }
    .offline-card { max-width: 420px; }
    .offline-card img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 20px; }
    .offline-card h1 { font-size: 1.6rem; margin: 0 0 8px; }
    .offline-card p { color: var(--muted); margin: 0 0 24px; }
  </style>
</head>
<body>
  <main class="offline">
    <div class="offline-card">
      <img src="assets/icons/icon-192.png" alt="">
      <h1>You're offline</h1>
      <p>BloodLink can't reach the internet right now. Check your connection and try again. Pages you've opened before still work offline.</p>
      <button class="btn btn-primary" type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
