<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · BloodLink</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#c62828">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BloodLink">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="BloodLink">
  <script src="js/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/motion.js" defer></script>
</head>
<body>
  <header class="lp-header">
    <a class="lp-brand" href="dashboard.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2s7 7.6 7 13a7 7 0 0 1-14 0c0-5.4 7-13 7-13z"/></svg>
      BloodLink
    </a>
    <nav class="lp-nav" aria-label="Main">
      <a class="lp-link" href="dashboard.html" aria-current="page">Dashboard</a>
      <button type="button" class="lp-btn lp-btn-ghost" data-logout>Log out</button>
    </nav>
  </header>

  <section class="band">
    <div class="band-inner">
      <div>
        <p class="kicker">Hospital dashboard</p>
        <h1 data-split>Blood requests</h1>
        <p id="hospital-name"></p>
      </div>
      <a class="lp-btn lp-btn-white lp-btn-lg" href="new-request.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        New request
      </a>
    </div>
  </section>

  <main class="container overlap">
    <div id="alert" class="alert" hidden></div>
    <div id="requests"></div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <a class="lp-brand" href="dashboard.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2s7 7.6 7 13a7 7 0 0 1-14 0c0-5.4 7-13 7-13z"/></svg>
        BloodLink
      </a>
      <p><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>BloodLink is a prototype. Any real donation still goes through a hospital or blood bank's normal screening.</p>
    </div>
  </footer>

  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
